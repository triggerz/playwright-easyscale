version: '3.8'

services:
  # Orchestrator API - Backend service
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SECRET=${AUTH_SECRET:-test-secret-passphrase}
      - RAILWAY_API_TOKEN=${RAILWAY_API_TOKEN}
      - RAILWAY_PROJECT_ID=${RAILWAY_PROJECT_ID}
      - RAILWAY_SERVICE_ID=${RAILWAY_SERVICE_ID}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-auto}
    volumes:
      # Mount worker tests directory so orchestrator can scan them
      - ./worker/tests:/app/worker/tests:ro
    networks:
      - easyscale-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web UI - Frontend service
  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - easyscale-network

networks:
  easyscale-network:
    driver: bridge
