<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test App - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Test Application</h1>
            <p class="subtitle">Simple app for Playwright EasyScale testing</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="user1@example.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Any password works"
                        required
                    >
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <div class="info">
                <p>💡 This is a test application for Playwright EasyScale</p>
                <p>Any email/password combination will work!</p>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
